name = "wolso-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Bundles the migration files in as strings so /admin/health/schema can
# hand back the exact SQL for whatever migration is missing. Retyping the
# statements into the source would let them drift from the real files —
# which is precisely the failure this endpoint exists to catch.
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# CORS origins the API accepts requests from. Update once you know the
# real Pages URLs (or a custom domain) — see src/lib/cors.ts.
[vars]
ADMIN_ORIGIN = "https://wolso-admin.pages.dev"
APP_ORIGIN = "https://wolso.pages.dev"
# Support account the automatic reminders point people at. Without the '@'.
SUPPORT_USERNAME = "nchtsupport"

# Automatic bot reminders — see src/lib/reminders.ts. Hourly rather than
# daily so a batch that hits the per-run cap is picked up soon after,
# not tomorrow; the reminders themselves are rate-limited by their own
# "already sent" bookkeeping, not by how often this fires.
[triggers]
crons = ["0 * * * *"]

# Created with: wrangler d1 create wolso
# Paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "wolso"
database_id = "3bd49b64-c1ac-494a-a747-b5a02d421b59"

# No R2 bucket — worker documents are stored directly in D1 (see
# migrations/0005_document_blob_storage.sql). R2 needs a billing
# subscription even on the free tier, which isn't available everywhere.

# Secrets (never put these here — set with `wrangler secret put <NAME>`):
#   BOT_TOKEN          — the Telegram bot token from @BotFather
#   SESSION_SECRET      — any long random string, used to sign session tokens
#   OWNER_TELEGRAM_ID   — your own numeric Telegram user id, to bootstrap the first Owner
#   ADMIN_CHAT_ID       — optional: where the bot sends operator alerts (new signups,
#                         employers awaiting verification, support tickets). Defaults to
#                         OWNER_TELEGRAM_ID. Must be a numeric id — a bot can't message
#                         a @username — and you must press Start in the bot once first.
